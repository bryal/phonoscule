<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Phonoscule</title>
  <!--
    The Cover Flow: the playing album square on, two covers either side tilted towards it, each
    above its reflection. No backdrop: the mark stands on whatever the taskbar or launcher is.
    See ./README.md for how the raster forms are generated, and phonoscule-small.svg for the one
    small sizes use.

    The covers are where the player's own camera (gui/src/coverflow.rs) sees them, so a side
    cover's outer edge is its nearest and tallest, and its inner edge tucks behind the cover in
    front of it. Each reflection is its cover mirrored about that cover's bottom edge, as much of it
    as no nearer reflection hides, and fades down its own length the way the player's does
    (coverflow.wgsl): from 0.3 at the seam, quadratically, to nothing.

    Notes are embossed on the playing cover and on the near pair, and so show in their reflections
    too. Each is drawn once, in a cover's own 100-unit square, and put on a tilted cover by the
    perspective that carries the cover's corners there, taken at the note's middle. Those on the
    near pair sit in the middle of what shows of their covers.
  -->
  <defs>
    <!-- No real album art, so a colour for each cover, stepping from blue on the left through
         lavender in the middle to pink on the right: #4b7bff, #7f8cff, #b39dff, #d986da, #ff6eb4.
         The neighbours are shaded towards the edge that goes behind: their colour times 1 at the
         outer edge and 0.72 at the inner, or 0.8 and 0.58 for the far pair. -->
    <linearGradient id="far-left" x1="1" y1="0" x2="61" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3c62cc"/>
      <stop offset="1" stop-color="#2c4794"/>
    </linearGradient>
    <linearGradient id="near-left" x1="21" y1="0" x2="79" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7f8cff"/>
      <stop offset="1" stop-color="#5b65b8"/>
    </linearGradient>
    <linearGradient id="near-right" x1="235" y1="0" x2="177" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d986da"/>
      <stop offset="1" stop-color="#9c609d"/>
    </linearGradient>
    <linearGradient id="far-right" x1="255" y1="0" x2="195" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cc5890"/>
      <stop offset="1" stop-color="#944068"/>
    </linearGradient>

    <!-- Two beamed eighth notes for the playing cover, one eighth for each neighbour, embossed: the
         face a pale tint of the cover, lit along its upper left edges and shadowed along its lower
         right. Each rim is the note nudged that way, less the note itself, so neither shows
         through the face. -->
    <path id="flag" d="M0,0 C1.5,8 8.5,12 12.5,18 C16.5,24 17.5,33 13.5,42 C15.5,33 12.5,27 7.5,22 C4.5,19 1.5,15 0,11 Z"/>
    <g id="eighth-shape">
      <ellipse cx="42" cy="72" rx="15.5" ry="11" transform="rotate(-24 42 72)"/>
      <rect x="51.5" y="16" width="6" height="56"/>
      <use href="#flag" transform="translate(57.5 16)"/>
    </g>
    <g id="beamed-eighths-shape">
      <ellipse cx="29" cy="73" rx="13.5" ry="10" transform="rotate(-24 29 73)"/>
      <ellipse cx="67" cy="66" rx="13.5" ry="10" transform="rotate(-24 67 66)"/>
      <rect x="36" y="22" width="5.5" height="48"/>
      <rect x="74" y="15" width="5.5" height="48"/>
      <polygon points="36,22 79.5,14 79.5,25 36,33"/>
    </g>
    <mask id="eighth-light-rim" maskUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120">
      <use href="#eighth-shape" fill="#ffffff" transform="translate(-1.7 -1.7)"/>
      <use href="#eighth-shape" fill="#000000"/>
    </mask>
    <mask id="eighth-dark-rim" maskUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120">
      <use href="#eighth-shape" fill="#ffffff" transform="translate(1.7 1.7)"/>
      <use href="#eighth-shape" fill="#000000"/>
    </mask>
    <g id="eighth">
      <rect x="-10" y="-10" width="120" height="120" fill="#ffffff" fill-opacity="0.9" mask="url(#eighth-light-rim)"/>
      <rect x="-10" y="-10" width="120" height="120" fill="#000000" fill-opacity="0.38" mask="url(#eighth-dark-rim)"/>
      <use href="#eighth-shape" fill="#ffffff" opacity="0.6"/>
    </g>
    <mask id="beamed-eighths-light-rim" maskUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120">
      <use href="#beamed-eighths-shape" fill="#ffffff" transform="translate(-1.7 -1.7)"/>
      <use href="#beamed-eighths-shape" fill="#000000"/>
    </mask>
    <mask id="beamed-eighths-dark-rim" maskUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120">
      <use href="#beamed-eighths-shape" fill="#ffffff" transform="translate(1.7 1.7)"/>
      <use href="#beamed-eighths-shape" fill="#000000"/>
    </mask>
    <g id="beamed-eighths">
      <rect x="-10" y="-10" width="120" height="120" fill="#ffffff" fill-opacity="0.9" mask="url(#beamed-eighths-light-rim)"/>
      <rect x="-10" y="-10" width="120" height="120" fill="#000000" fill-opacity="0.38" mask="url(#beamed-eighths-dark-rim)"/>
      <use href="#beamed-eighths-shape" fill="#ffffff" opacity="0.6"/>
    </g>
    <!-- What shows of the near pair's reflections. -->
    <clipPath id="near-left-shown"><polygon points="23,141 66,130.3 66,213 26,236"/></clipPath>
    <clipPath id="near-right-shown"><polygon points="233,141 190,130.3 190,213 230,236"/></clipPath>

    <!-- The fade, 0.3 * (1 - v)^2 down a reflection, and where v runs for each: from the middle of
         its seam, square to the seam, to the middle of its lower edge. -->
    <linearGradient id="fade" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.2" stop-color="#ffffff" stop-opacity="0.192"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.108"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.048"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.012"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-far-left" href="#fade" x1="32" y1="131.5" x2="50.1" y2="212.4"/>
    <linearGradient id="fade-near-left" href="#fade" x1="51" y1="134" x2="71.5" y2="215.9"/>
    <linearGradient id="fade-middle" href="#fade" x1="0" y1="156" x2="0" y2="280"/>
    <linearGradient id="fade-near-right" href="#fade" x1="205" y1="134" x2="184.5" y2="215.9"/>
    <linearGradient id="fade-far-right" href="#fade" x1="224" y1="131.5" x2="205.9" y2="212.4"/>
    <mask id="far-left-reflection" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="300">
      <rect width="256" height="300" fill="url(#fade-far-left)"/>
    </mask>
    <mask id="near-left-reflection" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="300">
      <rect width="256" height="300" fill="url(#fade-near-left)"/>
    </mask>
    <mask id="middle-reflection" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="300">
      <rect width="256" height="300" fill="url(#fade-middle)"/>
    </mask>
    <mask id="near-right-reflection" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="300">
      <rect width="256" height="300" fill="url(#fade-near-right)"/>
    </mask>
    <mask id="far-right-reflection" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="300">
      <rect width="256" height="300" fill="url(#fade-far-right)"/>
    </mask>
  </defs>

  <!-- Lowered, so the covers look centred, their faint reflections hardly counting. -->
  <g transform="translate(0 12)">
    <polygon points="3,138 23,133.5 26,220 6,230" fill="url(#far-left)" mask="url(#far-left-reflection)"/>
    <g clip-path="url(#near-left-shown)" mask="url(#near-left-reflection)">
      <rect width="256" height="256" fill="url(#near-left)"/>
      <use href="#eighth" transform="matrix(0.5796 -0.2399 -0.0213 -0.8829 20.66 235.45)"/>
    </g>
    <g mask="url(#middle-reflection)">
      <rect x="66" y="156" width="124" height="124" fill="#b39dff"/>
      <use href="#beamed-eighths" transform="matrix(1.24 0 0 -1.24 66 280)"/>
    </g>
    <g clip-path="url(#near-right-shown)" mask="url(#near-right-reflection)">
      <rect width="256" height="256" fill="url(#near-right)"/>
      <use href="#eighth" transform="matrix(0.5571 0.2305 0.0193 -0.8663 177.75 210.75)"/>
    </g>
    <polygon points="253,138 233,133.5 230,220 250,230" fill="url(#far-right)" mask="url(#far-right-reflection)"/>

    <!-- Back to front, so each cover hides what is behind it. -->
    <polygon points="1,42 60,46 61,125 3,138" fill="url(#far-left)"/>
    <polygon points="196,46 255,42 253,138 195,125" fill="url(#far-right)"/>
    <polygon points="21,41 78,45 79,127 23,141" fill="url(#near-left)"/>
    <use href="#eighth" transform="matrix(0.5949 -0.0538 0.0157 0.9291 16.11 45.35)"/>
    <polygon points="178,45 235,41 233,141 177,127" fill="url(#near-right)"/>
    <use href="#eighth" transform="matrix(0.5724 0.0518 -0.0147 0.9114 180.60 40.87)"/>
    <rect x="66" y="32" width="124" height="124" fill="#b39dff"/>
    <use href="#beamed-eighths" transform="matrix(1.24 0 0 1.24 66 32)"/>
  </g>
</svg>
