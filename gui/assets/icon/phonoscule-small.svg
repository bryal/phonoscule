<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Phonoscule (small sizes)</title>
  <!--
    The same mark for 16, 24 and 32 pixels, where the full one (./phonoscule.svg) turns to mud: one
    cover either side rather than two, all of them larger, and the perspective a little steeper so a
    side cover still narrows towards the middle when it is three pixels wide. The reflections are
    the full one's, and so are the notes on the playing cover, in their colour but not embossed:
    one on a side cover would be a smudge, and the embossing less than a pixel.

    Edges sit on whole pixels at 16 and 32, where a unit is 16 and 8 of them. A side cover is drawn
    only where it shows, from the edge to the playing cover.
  -->
  <defs>
    <!-- The full mark's colours, but its outer pair's for the neighbours, which tell apart better
         at these sizes; shaded as the full mark's near pair is where it meets the playing cover. -->
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b7bff"/>
      <stop offset="1" stop-color="#3a60c7"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6eb4"/>
      <stop offset="1" stop-color="#c7568c"/>
    </linearGradient>

    <!-- The full mark's notes for the playing cover, in a cover's own 100-unit square. -->
    <g id="beamed-eighths" fill="#614370">
      <ellipse cx="29" cy="73" rx="13.5" ry="10" transform="rotate(-24 29 73)"/>
      <ellipse cx="67" cy="66" rx="13.5" ry="10" transform="rotate(-24 67 66)"/>
      <rect x="36" y="22" width="5.5" height="48"/>
      <rect x="74" y="15" width="5.5" height="48"/>
      <polygon points="36,22 79.5,14 79.5,25 36,33"/>
    </g>

    <linearGradient id="fade" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.2" stop-color="#ffffff" stop-opacity="0.192"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.108"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.048"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.012"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-left" href="#fade" x1="24" y1="152" x2="57.6" y2="252.8"/>
    <linearGradient id="fade-middle" href="#fade" x1="0" y1="176" x2="0" y2="336"/>
    <linearGradient id="fade-right" href="#fade" x1="232" y1="152" x2="198.4" y2="252.8"/>
    <mask id="left-reflection" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="340">
      <rect width="256" height="340" fill="url(#fade-left)"/>
    </mask>
    <mask id="middle-reflection" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="340">
      <rect width="256" height="340" fill="url(#fade-middle)"/>
    </mask>
    <mask id="right-reflection" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="340">
      <rect width="256" height="340" fill="url(#fade-right)"/>
    </mask>
  </defs>

  <!-- Lowered a pixel, so the covers look centred, their faint reflections hardly counting. -->
  <g transform="translate(0 16)">
    <polygon points="0,160 48,144 48,240 0,288" fill="url(#left)" mask="url(#left-reflection)"/>
    <polygon points="208,144 256,160 256,288 208,240" fill="url(#right)" mask="url(#right-reflection)"/>
    <g mask="url(#middle-reflection)">
      <rect x="48" y="176" width="160" height="160" fill="#b39dff"/>
      <use href="#beamed-eighths" transform="matrix(1.6 0 0 -1.6 48 336)"/>
    </g>

    <polygon points="0,32 48,48 48,144 0,160" fill="url(#left)"/>
    <polygon points="208,48 256,32 256,160 208,144" fill="url(#right)"/>
    <rect x="48" y="16" width="160" height="160" fill="#b39dff"/>
    <use href="#beamed-eighths" transform="matrix(1.6 0 0 1.6 48 16)"/>
  </g>
</svg>
