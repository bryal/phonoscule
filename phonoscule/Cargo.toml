[package]
name = "phonoscule"
version = "0.3.0-dev"
description = "A framework for building music players."
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The parsing and decoding core is always built and stays portable. Everything a hosted player
# wants on top of it -- and every heavyweight dependency -- sits behind a feature, all off by
# default. See each module's docs for what it needs.
[features]
default = []
# The shared TOML config file (see `config`). Wants std and a filesystem.
config = ["dep:smol", "dep:toml_edit", "dep:shellexpand", "dep:anyhow", "log/std"]
# Scanning a music directory into albums, with cover thumbnails (see `library`). Wants std and a
# filesystem.
library = ["dep:smol", "dep:futures", "dep:serde", "dep:serde_json", "dep:image", "dep:embedded-io-adapters", "log/std"]
# Album ordering (see `sort`).
sort = ["library", "dep:serde"]
# Fuzzy text ranking, for searching a library (see `search`).
search = []
# Persisting a player's queue and the state around it across runs (see `session`). Wants std and a
# filesystem.
session = ["player", "sort", "dep:smol", "dep:serde", "dep:serde_json", "log/std"]
# The play-queue engine (see `player`). Wants std, a filesystem, and PulseAudio.
player = ["dep:smol", "dep:pulse-simple", "dep:embedded-io-adapters", "dep:serde", "log/std"]
# Per-application volume through the OS mixer (see `volume`). Wants std.
volume = ["dep:smol", "dep:libpulse-binding", "log/std"]
# Watching the music directory for changes (see `watcher`). Wants std and a filesystem.
watcher = ["dep:smol", "dep:futures", "dep:notify", "log/std"]
# An MPRIS server for media keys and desktop now-playing (see `mpris`). Wants a D-Bus session bus.
mpris = ["dep:smol", "dep:zbus", "log/std"]

[dependencies]
# rev is latest as of its commit date 2026-07-05
opuscule = "0.2.0"
ogg = "0.9.2"
utf8-decode = "2.0"
embedded-io       = { workspace = true }
embedded-io-async = { workspace = true }
log               = { workspace = true }

# Optional, for the features above.
smol                 = { workspace = true, optional = true }
embedded-io-adapters = { workspace = true, optional = true }
pulse-simple         = { version = "1.0.1", optional = true }
serde                = { version = "1.0.228", features = ["derive"], optional = true }
serde_json           = { version = "1.0.150", optional = true }
image                = { version = "0.25.10", optional = true }
toml_edit            = { version = "0.25", optional = true }
shellexpand          = { version = "3.1", optional = true }
anyhow               = { version = "1.0", optional = true }
futures              = { version = "0.3.32", optional = true }
notify               = { version = "8.2", optional = true }
zbus                 = { version = "5.17", optional = true }

# The Linux volume-mixer backend; other platforms build the module's mixerless fallback instead.
# Speaks to PipeWire via pipewire-pulse.
[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = { version = "2.30.1", optional = true }

[dev-dependencies]
embedded-io-adapters = { workspace = true }
smol                 = { workspace = true }
simple_logger        = { workspace = true }
criterion            = "0.8"
futures              = "0.3.32"
ogg                  = "0.9.2"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "scan"
harness = false
required-features = ["library"]
