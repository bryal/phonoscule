<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Phonoscule (small sizes)</title>
  <!--
    The same mark for 16, 24 and 32 pixels, where the full one (./phonoscule.svg) turns to mud: one
    cover either side rather than two, all of them larger, and the perspective a little steeper so a
    side cover still narrows towards the middle when it is three pixels wide.

    Edges sit on whole pixels at 16 and 32, where a unit is 16 and 8 of them. A side cover is drawn
    only where it shows, from the edge to the playing cover.
  -->
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="0.52" stop-color="#f6603c"/>
      <stop offset="1" stop-color="#d92b7a"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9d8cff"/>
      <stop offset="1" stop-color="#5a46c8"/>
    </linearGradient>
    <linearGradient id="right" href="#left" x1="1" x2="0"/>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflection" maskContentUnits="objectBoundingBox">
      <rect width="1" height="1" fill="url(#fade)"/>
    </mask>
  </defs>

  <!-- Lowered a pixel, so the covers look centred, their faint reflections hardly counting. -->
  <g transform="translate(0 16)">
    <polygon points="0,160 48,144 48,240 0,288" fill="url(#left)" mask="url(#reflection)"/>
    <polygon points="208,144 256,160 256,288 208,240" fill="url(#right)" mask="url(#reflection)"/>
    <rect x="48" y="176" width="160" height="160" fill="url(#cover)" mask="url(#reflection)"/>

    <polygon points="0,32 48,48 48,144 0,160" fill="url(#left)"/>
    <polygon points="208,48 256,32 256,160 208,144" fill="url(#right)"/>
    <rect x="48" y="16" width="160" height="160" fill="url(#cover)"/>
  </g>
</svg>
