# The census's headless compositor: one virtual output for the player to open its window on.
# No bar, no bindings, no idle - the census drives everything from outside (see
# memory-census-gui.sh). The resolution is fixed so runs are comparable: per-frame costs and the
# swapchain scale with the window, which out here nobody else gets to size.
output HEADLESS-1 resolution 1920x1080
default_border none
