[package]
name = "phonoscule-android"
version = "0.1.0-dev"
description = "The Rust core of Phonoscule for Android."
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib for Android to load via System.loadLibrary; lib so `cargo test` can exercise the protocol
# on the host without a device.
crate-type = ["cdylib", "lib"]

[dependencies]
phonoscule = { path = "../phonoscule", features = ["library", "player", "queue", "search", "session", "sort"] }
anyhow = "1.0"
futures = { workspace = true }
smol = { workspace = true }
log = { workspace = true, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# The JNI shim and the logger only mean anything inside an app. Leaving them out of host builds
# keeps `cargo test` free of the JVM.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.15"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
simple_logger = { workspace = true }
