[package]
name = "phonoscule-tui"
version = "1.1.0-dev"
description = "A TUI music player based on Phonoscule"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
phonoscule = { path = "../phonoscule", features = ["config", "dirs", "library", "media", "player", "queue", "search", "session", "sort", "volume", "watcher"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
# Half blocks only (see the covers module), so none of its protocol backends are wanted -- and
# `image-defaults` would drag in every image codec to decode files this player never opens.
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
# No codecs: the player reads raw thumbnails the library already decoded, and shrinks them. It never
# opens an encoded image.
image = { version = "0.25.10", default-features = false }
anyhow = "1.0"
futures = "0.3.32"
smol                 = { workspace = true }
log                  = { workspace = true, features = ["std"] }
