<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Phonoscule</title>
  <!--
    The Cover Flow: the playing album square on, two covers either side tilted towards it, each
    above its reflection. No backdrop: the mark stands on whatever the taskbar or launcher is.
    See ./README.md for how the raster forms are generated, and phonoscule-small.svg for the one
    small sizes use.

    The covers are where the player's own camera (gui/src/coverflow.rs) sees them, so a side
    cover's outer edge is its nearest and tallest, and its inner edge tucks behind the cover in
    front of it. Every reflection is its cover mirrored about that cover's bottom edge, faded by
    the `reflection` mask.
  -->
  <defs>
    <!-- The playing cover: no real album art, so a warm sweep, which reads on a light or a dark
         taskbar alike. -->
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="0.52" stop-color="#f6603c"/>
      <stop offset="1" stop-color="#d92b7a"/>
    </linearGradient>

    <!-- The neighbours: cool against the playing cover, lit on the near edge and shaded where they
         go behind. The far pair is darker still. -->
    <linearGradient id="near-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9d8cff"/>
      <stop offset="1" stop-color="#5a46c8"/>
    </linearGradient>
    <linearGradient id="near-right" href="#near-left" x1="1" x2="0"/>
    <linearGradient id="far-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f5fd6"/>
      <stop offset="1" stop-color="#3f2f99"/>
    </linearGradient>
    <linearGradient id="far-right" href="#far-left" x1="1" x2="0"/>

    <!-- Fades each reflection out over the top half of its own box. -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflection" maskContentUnits="objectBoundingBox">
      <rect width="1" height="1" fill="url(#fade)"/>
    </mask>
  </defs>

  <!-- Lowered, so the covers look centred, their faint reflections hardly counting. Back to front,
       reflections first, so each cover hides what is behind it. -->
  <g transform="translate(0 12)">
    <polygon points="3,138 61,125 62,202 6,230" fill="url(#far-left)" mask="url(#reflection)"/>
    <polygon points="195,125 253,138 250,230 194,202" fill="url(#far-right)" mask="url(#reflection)"/>
    <polygon points="23,141 79,127 80,205 26,236" fill="url(#near-left)" mask="url(#reflection)"/>
    <polygon points="177,127 233,141 230,236 176,205" fill="url(#near-right)" mask="url(#reflection)"/>
    <rect x="66" y="156" width="124" height="124" fill="url(#cover)" mask="url(#reflection)"/>

    <polygon points="1,42 60,46 61,125 3,138" fill="url(#far-left)"/>
    <polygon points="196,46 255,42 253,138 195,125" fill="url(#far-right)"/>
    <polygon points="21,41 78,45 79,127 23,141" fill="url(#near-left)"/>
    <polygon points="178,45 235,41 233,141 177,127" fill="url(#near-right)"/>
    <rect x="66" y="32" width="124" height="124" fill="url(#cover)"/>
  </g>
</svg>
