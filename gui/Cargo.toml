[package]
name = "phonoscule-gui"
authors.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
phonoscule = { path = "../phonoscule" }
pulse-simple = "1.0.1"
iced = { version = "0.14.0", features = ["image", "smol", "advanced", "lazy"] }
image = "0.25.10"
glam = "0.33.2"
bytemuck = { version = "1.24", features = ["derive"] }
anyhow = "1.0"
toml_edit = "0.25"
shellexpand = "3.1"
futures = "0.3.32"
# iced's image `Handle` stores its pixels as a `bytes::Bytes` (a shared, ref-counted buffer); we
# name the type to hand a cheap clone to the cover-flow GPU upload without copying the pixels.
bytes = "1.12"
smol                 = { workspace = true }
embedded-io-adapters = { workspace = true }
embedded-io-async    = { workspace = true }
log                  = { workspace = true, features = ["std"] }
simple_logger        = { workspace = true }
url = "2.5.8"
# A small bespoke MPRIS server built on zbus directly (see media.rs). zbus is already in the tree
# (iced pulls it), and the default async-io runtime matches iced's smol executor.
zbus = "5.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
notify = "8.2"

[dev-dependencies]
criterion = "0.8"
ogg = "0.9.2"

[[bench]]
name = "scan"
harness = false
