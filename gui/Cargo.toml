[package]
name = "phonoscule-gui"
version = "1.2.0-dev"
description = "An album-centric graphical music player built on phonoscule and iced."
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
phonoscule = { path = "../phonoscule", features = ["mpris", "player", "volume", "watcher"] }
iced = { version = "0.14.0", features = ["image", "smol", "advanced", "lazy"] }
image = "0.25.10"
glam = "0.33.2"
bytemuck = { version = "1.24", features = ["derive"] }
anyhow = "1.0"
toml_edit = "0.25"
shellexpand = "3.1"
futures = "0.3.32"
bytes = "1.12"
smol                 = { workspace = true }
embedded-io-adapters = { workspace = true }
embedded-io-async    = { workspace = true }
log                  = { workspace = true, features = ["std"] }
simple_logger        = { workspace = true }
url = "2.5.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
criterion = "0.8"
ogg = "0.9.2"

[[bench]]
name = "scan"
harness = false
